name: Pull Request

on:
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - &cache
        name: Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # 2.9.1
      
      - name: Show CPU info
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: lscpu

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --workspace --verbose --all-features --no-fail-fast

  test-big-endian:
    name: Test Big-Endian and 32-bit arch
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ "s390x-unknown-linux-gnu", "i686-unknown-linux-gnu" ]
    steps:
      - *checkout
      - *cache

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: "rust-src"
          targets: "${{ matrix.target }}"
      
      - name: Install cargo cross
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # 2.81.9
        with:
          tool: cross@0.2.5
      
      - name: Test on ${{ matrix.target }}
        run: cross test --target ${{ matrix.target }}

  miri:
    name: Miri
    runs-on: "ubuntu-latest"
    steps:
      - *checkout
      - *cache

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: "miri,rust-src"

      - name: Run miri test
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: cargo miri t

  fmt:
    name: Rustfmt
    runs-on: "ubuntu-latest"
    steps:
      - *checkout
      - *cache

      # nightly is needed for the unstable rustfmt options specified in project rustfmt.toml
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: "rustfmt"

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: "ubuntu-latest"
    steps:
      - *checkout
      - *cache

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "stable"
          components: "clippy"

      - name: Check Clippy
        run: cargo clippy --workspace --all-features --examples --lib -- -D warnings

  docs:
    name: Docs
    runs-on: "ubuntu-latest"
    env:
      # deny rustdoc warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - *checkout
      - *cache

        # nightly is needed for the unstable rustdoc options
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: "rust-docs"

      - name: Check docs
        run: cargo doc --workspace --verbose --all-features --no-deps -Zunstable-options -Zrustdoc-scrape-examples
